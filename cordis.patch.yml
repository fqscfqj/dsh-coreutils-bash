- id: preset-minimal
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: minimal
    order: 3
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a helpful software engineer assistant.
          complete: true
          includeRuntimeContext: false
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          read: false
          readImage: true
          write: false
          edit: false
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
      - id: persistent-shell
        name: cordis:group
        group: true
        isolate:
          terminals: true
        config:
          - id: pty
            name: '@deepseek-ai/dsh-terminal'
          - id: coreutils-terminal
            name: 'dsh-coreutils-bash/terminal'
            config:
              backendType: coreutils-bash
              shellDialect: bash
              timeoutMs: 300000
          - id: persistent-bash
            name: '@deepseek-ai/dsh-tool-bash-persistent'
            config:
              backendType: coreutils-bash
              timeoutMs: 300000
              description: |-
                Run commands in a persistent native Bash shell backed by Microsoft Coreutils.
                * The command parameter uses Bash syntax and does not need XML escaping.
                * State persists across calls for this agent.
                * Prefer relative paths and avoid commands that produce very large output.

